name: Build desktop release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Package version without v prefix, for example 0.1.0"
        required: false
        default: "0.1.0"
      release_confirmed:
        description: "Confirm that final feature and business acceptance is complete"
        required: true
        type: boolean
        default: false
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.11"

jobs:
  test:
    name: Test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows x64
          - os: macos-15
            name: macOS Apple Silicon
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.lock.txt ]; then
            python -m pip install -r requirements.lock.txt
          else
            python -m pip install -r requirements.txt
          fi
          python -m pip install -r requirements-build.txt
          python -m pip install ruff==0.16.5
      - name: Compile runtime sources
        shell: bash
        run: python -m compileall -q agent api data app.py
      - name: Run Python regression suite
        shell: bash
        run: PYTHONDONTWRITEBYTECODE=1 python -B -m unittest discover -s tests -p 'test_*.py' -q
      - name: Run Ruff checks
        shell: bash
        run: python -m ruff check .

  frontend-quality:
    name: Frontend quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Check frontend formatting
        run: pnpm run format:check
      - name: Run frontend lint
        run: pnpm run lint
      - name: Build frontend bundles
        run: pnpm run build:check

  release-preflight:
    name: Release source preflight
    runs-on: ubuntu-latest
    outputs:
      public_license_present: ${{ steps.public_license.outputs.present }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check release policy
        id: public_license
        shell: bash
        run: |
          if [ -s LICENSE ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No LICENSE file is present; GitHub Release creation will be skipped."
          fi
      - name: Check launchers and source staging
        shell: bash
        run: |
          bash -n install.sh start.command
          staging="$RUNNER_TEMP/pfs-release-staging"
          manifest="$RUNNER_TEMP/pfs-release-manifest.json"
          report="$RUNNER_TEMP/pfs-release-audit.json"
          python packaging/build_manifest.py \
            --source . \
            --destination "$staging" \
            --manifest "$manifest"
          python packaging/audit_artifact.py "$staging" --report "$report"
          python - "$manifest" "$report" <<'PY'
          import json
          import sys

          manifest = json.loads(open(sys.argv[1], encoding="utf-8").read())
          report = json.loads(open(sys.argv[2], encoding="utf-8").read())
          if not report.get("ok"):
              raise SystemExit("release staging audit failed")
          if not manifest.get("file_count"):
              raise SystemExit("release staging is empty")
          print(
              "release staging:",
              manifest["file_count"],
              "files /",
              manifest["total_bytes"],
              "bytes",
          )
          PY

  windows-clean-install:
    name: Windows clean source install
    needs: [test, frontend-quality, release-preflight]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Run installer against a clean local clone
        shell: pwsh
        env:
          PFS_REPO_URL: ${{ github.workspace }}
          PFS_INSTALL_ROOT: ${{ runner.temp }}\pfs-install-root
          PFS_PROJECT_NAME: pfs-clean-install
          PFS_LAUNCHER_PATH: ${{ runner.temp }}\pfs-clean-install.bat
        run: |
          & powershell.exe -ExecutionPolicy Bypass -File .\install.ps1
          if ($LASTEXITCODE -ne 0) {
            throw "Windows clean installer failed."
          }
          $project = Join-Path $env:PFS_INSTALL_ROOT $env:PFS_PROJECT_NAME
          $python = Join-Path $project ".venv\Scripts\python.exe"
          if (-not (Test-Path -LiteralPath $python)) {
            throw "Clean install did not create its virtual environment."
          }
          if (-not (Test-Path -LiteralPath (Join-Path $project "app.py"))) {
            throw "Clean install did not contain app.py."
          }
          if (-not (Test-Path -LiteralPath $env:PFS_LAUNCHER_PATH)) {
            throw "Clean install did not create its launcher."
          }
          & $python -c 'import sys; raise SystemExit(0 if sys.version_info >= (3, 10) else 1)'

  build-windows:
    name: Build Windows installer
    needs: [test, frontend-quality]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Build frontend bundle
        shell: bash
        run: |
          pnpm install --frozen-lockfile
          pnpm run build
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Resolve package version
        shell: pwsh
        env:
          DISPATCH_VERSION: ${{ github.event.inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $version = $env:DISPATCH_VERSION
          if (-not $version) {
            $version = $env:REF_NAME -replace '^v', ''
          }
          if ($version -notmatch '^[0-9]+\.[0-9]+\.[0-9]+(?:[-+][0-9A-Za-z.-]+)?$') {
            throw "Invalid package version: $version"
          }
          "PACKAGE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          # Install CPU-only torch to avoid CUDA wheels (~2 GB).
          # The +cpu index is only needed on Windows; on macOS torch is CPU-only by default.
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          if (Test-Path -LiteralPath requirements.lock.txt) {
            python -m pip install -r requirements.lock.txt
          } else {
            python -m pip install -r requirements.txt
          }
          python -m pip install -r requirements-build.txt
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Build audited Windows installer
        shell: pwsh
        run: pwsh -File packaging/build_windows.ps1 -Version $env:PACKAGE_VERSION
      - name: Upload Windows package and reports
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-package
          if-no-files-found: error
          retention-days: 14
          path: |
            build/w/installer/PFSDataAnalysisAgent-Windows-x64.exe
            build/w/reports/*.json

  build-macos:
    name: Build macOS DMG (${{ matrix.name }})
    needs: [test, frontend-quality]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            name: Apple Silicon
            uname: arm64
            artifact: macos-arm64-package
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Build frontend bundle
        shell: bash
        run: |
          pnpm install --frozen-lockfile
          pnpm run build
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install macOS ODBC runtime
        shell: bash
        run: |
          actual_arch="$(uname -m)"
          test "$actual_arch" = "${{ matrix.uname }}"
          brew install unixodbc
          test -f "$(brew --prefix unixodbc)/lib/libodbc.2.dylib"
      - name: Resolve package version
        shell: bash
        env:
          DISPATCH_VERSION: ${{ github.event.inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version="${DISPATCH_VERSION:-}"
          if [ -z "$version" ]; then
            ref_name="${REF_NAME:-}"
            version="${ref_name#v}"
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid package version: $version" >&2
            exit 2
          fi
          echo "PACKAGE_VERSION=$version" >> "$GITHUB_ENV"
      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          # macOS torch wheels are CPU-only by default; no special index needed.
          if [ -f requirements.lock.txt ]; then
            python -m pip install -r requirements.lock.txt
          else
            python -m pip install -r requirements.txt
          fi
          python -m pip install -r requirements-build.txt
          python -c "import pyodbc; print('pyodbc:', pyodbc.version)"
      - name: Build audited macOS DMG
        shell: bash
        run: bash packaging/build_macos.sh --version "$PACKAGE_VERSION"
      - name: Upload macOS package and reports
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 14
          path: |
            build/macos-package/dmg/PFSDataAnalysisAgent-macOS-*.dmg
            build/macos-package/reports/*.json

  release:
    name: Create GitHub Release
    needs: [build-windows, build-macos, windows-clean-install, release-preflight]
    if: ${{ needs.release-preflight.outputs.public_license_present == 'true' && github.event_name == 'workflow_dispatch' && inputs.release_confirmed == true }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
      - name: Resolve release tag
        shell: bash
        env:
          DISPATCH_VERSION: ${{ github.event.inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          # dispatch 输入 "1.0.0" → 拼 "v1.0.0";tag push 直接用 ref_name
          version="${DISPATCH_VERSION:-}"
          if [ -n "$version" ]; then
            normalized_version="${version#v}"
            if [[ ! "$normalized_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
              echo "Invalid package version: $version" >&2
              exit 2
            fi
            tag="v$normalized_version"
            draft_flag="--draft"
          else
            tag="${REF_NAME:-}"
            if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
              echo "Invalid release tag: $tag" >&2
              exit 2
            fi
            draft_flag=""
          fi
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
          echo "DRAFT_FLAG=$draft_flag" >> "$GITHUB_ENV"
      - name: Verify release artifact boundary
        shell: bash
        run: |
          find release-artifacts -type f | sort
          forbidden="$(find release-artifacts -type f \( \
            -path '*/staging/*' -o \
            -path '*/pyinstaller-dist/*' -o \
            -path '*/pyinstaller-work/*' -o \
            -path '*/dmg-root/*' -o \
            -path '*/MCP/*' -o \
            -path '*/uploads/*' -o \
            -path '*/outputs/*' -o \
            -name '*.log' -o \
            -name '*.p12' -o \
            -name '*.pfx' -o \
            -name '*.mobileprovision' \
          \) -print)"
          if [ -n "$forbidden" ]; then
            echo "$forbidden" >&2
            exit 2
          fi
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.sha }}
        shell: bash
        run: |
          if [[ ! "$TARGET_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "Invalid release target: $TARGET_SHA" >&2
            exit 2
          fi
          rm -rf release-upload
          mkdir -p release-upload
          while IFS= read -r file; do
            base="$(basename "$file")"
            case "$base" in
              *.exe|*.dmg)
                dest="release-upload/$base"
                ;;
              *)
                continue
                ;;
            esac
            if [ -e "$dest" ]; then
              echo "Duplicate release asset name after normalization: $(basename "$dest")" >&2
              echo "Source: $file" >&2
              exit 2
            fi
            cp "$file" "$dest"
          done < <(find release-artifacts -type f \( -name '*.exe' -o -name '*.dmg' \) | sort)

          mapfile -t files < <(find release-upload -type f \( -name '*.exe' -o -name '*.dmg' \) | sort)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No release files found." >&2
            exit 2
          fi
          (
            cd release-upload
            sha256sum *.exe *.dmg > SHA256SUMS.txt
          )
          files+=(release-upload/SHA256SUMS.txt)
          notes="Unsigned PFS Data Analysis Agent desktop test packages. The Windows package is not code-signed; the macOS packages are not code-signed or notarized. SHA256SUMS.txt is included for download verification. Do not treat these artifacts as signed or notarized releases."
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --title "$RELEASE_TAG" \
              --notes "$notes"
            while IFS= read -r asset; do
              case "$asset" in
                *.exe|*.dmg) ;;
                *) gh release delete-asset "$RELEASE_TAG" "$asset" -y ;;
              esac
            done < <(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')
            gh release upload "$RELEASE_TAG" "${files[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" "${files[@]}" $DRAFT_FLAG \
              --title "$RELEASE_TAG" \
              --target "$TARGET_SHA" \
              --notes "$notes"
          fi

  release-disabled:
    name: Release held (final confirmation required)
    needs: [build-windows, build-macos, windows-clean-install, release-preflight]
    if: ${{ needs.release-preflight.outputs.public_license_present != 'true' || github.event_name != 'workflow_dispatch' || inputs.release_confirmed != true }}
    runs-on: ubuntu-latest
    steps:
      - name: Explain release policy
        env:
          LICENSE_PRESENT: ${{ needs.release-preflight.outputs.public_license_present }}
          RELEASE_CONFIRMED: ${{ inputs.release_confirmed }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$LICENSE_PRESENT" != "true" ]]; then
            echo "Build artifacts were validated; GitHub Release is held because LICENSE is missing."
          elif [[ "$EVENT_NAME" != "workflow_dispatch" || "$RELEASE_CONFIRMED" != "true" ]]; then
            echo "Build artifacts were validated; GitHub Release is held until the final feature and business acceptance is explicitly confirmed."
          fi
